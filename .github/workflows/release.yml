#
# Push a tag like v1.1.0 and this builds Lazarus7.zip + Lazarus7.zip.sha256
# and publishes them as a GitHub release. The web launcher (docs/run.ps1)
# always fetches the latest release and checks the SHA256.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Tests target the Pester 3.4.0 that ships inside Windows (no install needed),
      # while the runner defaults to Pester 5. Pin the inbox version.
      - name: Pester
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 3.4.0 -Force
          $r = Invoke-Pester .\tests -PassThru
          if ($r.FailedCount -gt 0) { exit 1 }

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version and extract release notes from CHANGELOG.md
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code=$(grep -oP "Lazarus7Version = '\K[^']+" src/Lazarus7.Ui.psm1)
          if [ "$tag" != "$code" ]; then
            echo "::error::Tag is v$tag but src/Lazarus7.Ui.psm1 says $code"; exit 1
          fi
          awk -v v="$tag" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} /^\[[^]]+\]: / {next} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "::error::CHANGELOG.md has no entry for $tag"; exit 1; fi
          cat notes.md
      - name: Build zip (git archive applies .gitattributes line endings)
        run: |
          git archive --format=zip --prefix=Lazarus7/ -o Lazarus7.zip HEAD
          sha256sum Lazarus7.zip > Lazarus7.zip.sha256
          cat Lazarus7.zip.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Lazarus7.zip Lazarus7.zip.sha256 --title "Lazarus7 $GITHUB_REF_NAME" --notes-file notes.md
